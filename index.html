<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Lofi Focus Room</title>

<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Georgia, serif;
    background: #1b1412;
}

.room {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
        linear-gradient(
            to bottom,
            #3a2928 0%,
            #4b3430 72%,
            #241b18 72%,
            #241b18 100%
        );
}


/* =========================
   WALL
========================= */

.wall {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 72%;

    background:
        radial-gradient(
            circle at 30% 20%,
            rgba(255,255,255,.035),
            transparent 35%
        ),
        linear-gradient(
            #40302e,
            #352624
        );
}


/* =========================
   FLOOR
========================= */

.floor {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 28%;

    background:
        repeating-linear-gradient(
            90deg,
            #251b18 0px,
            #251b18 90px,
            #2c201c 92px,
            #251b18 180px
        );
}


/* =========================
   WINDOW
========================= */

.window {
    position: absolute;
    top: 8%;
    left: 52%;
    width: 300px;
    height: 270px;

    background:
        linear-gradient(
            #101b31,
            #172542
        );

    border: 12px solid #4a342d;

    box-shadow:
        0 8px 20px rgba(0,0,0,.45),
        inset 0 0 20px rgba(0,0,0,.5);

    cursor: pointer;

    transition:
        background 1s ease;

    z-index: 3;
}

.window::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 0;

    height: 100%;
    width: 7px;

    background: #4a342d;

    transform:
        translateX(-50%);
}

.window::after {
    content: "";

    position: absolute;

    top: 50%;
    left: 0;

    width: 100%;
    height: 7px;

    background: #4a342d;

    transform:
        translateY(-50%);
}


/* DAYTIME WINDOW */

.window.day {

    background:
        linear-gradient(
            to bottom,
            #6f9fbd 0%,
            #a9c7d2 58%,
            #d6d1b9 100%
        );
}


/* SUN */

.sun {
    display: none;

    position: absolute;

    width: 65px;
    height: 65px;

    border-radius: 50%;

    background: #f1d27c;

    top: 38px;
    right: 42px;

    box-shadow:
        0 0 30px rgba(241,210,124,.6);
}

.window.day .sun {
    display: block;
}


/* CLOUDS */

.cloud {
    display: none;

    position: absolute;

    width: 65px;
    height: 20px;

    background: rgba(240,240,230,.7);

    border-radius: 20px;
}

.cloud::before {
    content: "";

    position: absolute;

    width: 27px;
    height: 27px;

    left: 10px;
    top: -13px;

    border-radius: 50%;

    background: rgba(240,240,230,.7);
}

.cloud::after {
    content: "";

    position: absolute;

    width: 22px;
    height: 22px;

    right: 10px;
    top: -9px;

    border-radius: 50%;

    background: rgba(240,240,230,.7);
}

.cloud1 {
    top: 55px;
    left: 35px;
}

.cloud2 {
    top: 135px;
    left: 145px;
    transform: scale(.75);
}

.window.day .cloud {
    display: block;
}


/* DISTANT DAY TREES */

.day-trees {
    display: none;

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 75px;
}

.window.day .day-trees {
    display: block;
}

.day-tree {
    position: absolute;

    bottom: 0;

    width: 65px;
    height: 75px;

    background: #4d674f;

    clip-path:
        polygon(
            50% 0%,
            85% 35%,
            70% 35%,
            100% 70%,
            75% 70%,
            100% 100%,
            0% 100%,
            25% 70%,
            0% 70%,
            30% 35%,
            15% 35%
        );
}

.day-tree1 {
    left: 10px;

}

.day-tree2 {

}

.day-tree3 {

}

.day-tree4 {

<div class="modal" id="activityModal">

    <div class="modal-box">

        <h2>What are you going to do?</h2>

        <button onclick="chooseActivity('work')">
            💻 Work
        </button>

        <button onclick="chooseActivity('hobby')">
            🎨 Hobbies
        </button>

    </div>

</div>


<!-- =========================
     DURATION MODAL
========================= -->

<div class="modal" id="durationModal">

    <div class="modal-box">

        <h2>How long do you want to focus?</h2>

        <input
            id="minutesInput"
            type="number"
            min="1"
            max="999"
            placeholder="Minutes"
        >

        <button onclick="startSession()">
            Start
        </button>

    </div>

</div>


<!-- =========================
     TIMER
========================= -->

<div class="timer" id="timer">

    <div class="timer-time" id="timerDisplay">
        00:00
    </div>


    <button
        onclick="pauseTimer()"
        id="pauseButton"
    >
        Pause
    </button>


    <button onclick="endSession()">
        End Session
    </button>

</div>


<script>


/* =========================
   VARIABLES
========================= */

let selectedActivity = null;

let timerInterval = null;

let remainingSeconds = 0;

let paused = false;


/* =========================
   DAY / NIGHT
========================= */

document
    .getElementById("window")
    .addEventListener("click", function() {

        document
            .getElementById("timeModal")
            .style.display = "flex";

    });


function setTime(time) {

    const windowElement =
        document.getElementById("window");


    const moon =
        windowElement.querySelector(".moon");


    const stars =
        windowElement.querySelectorAll(".star");


    document
        .getElementById("timeModal")
        .style.display = "none";


    if (time === "day") {

        windowElement.classList.add("day");

        moon.style.display = "none";

        stars.forEach(function(star) {

            star.style.display = "none";

        });

    }


    if (time === "night") {

        windowElement.classList.remove("day");

        moon.style.display = "block";

        stars.forEach(function(star) {

            star.style.display = "block";

        });

    }

}


/* =========================
   CLOCK CLICK
========================= */

document
    .getElementById("clock")
    .addEventListener("click", function() {

        document
            .getElementById("activityModal")
            .style.display = "flex";

    });


/* =========================
   CHOOSE ACTIVITY
========================= */

function chooseActivity(activity) {

    selectedActivity = activity;


    document
        .getElementById("activityModal")
        .style.display = "none";


    document
        .getElementById("durationModal")
        .style.display = "flex";

}


/* =========================
   START SESSION
========================= */

function startSession() {

    const input =
        document.getElementById("minutesInput");


    let minutes =
        parseInt(input.value);


    if (!minutes || minutes < 1) {

        alert(
            "Please enter at least 1 minute."
        );

        return;

    }


    if (minutes > 999) {

        minutes = 999;

    }


    remainingSeconds =
        minutes * 60;


    document
        .getElementById("durationModal")
        .style.display = "none";


    const girl =
        document.getElementById("girl");


    girl.classList.remove("working");


    /* WORK */

    if (selectedActivity === "work") {

        girl.style.left = "68%";


        setTimeout(function() {

            girl.classList.add("working");

        }, 1800);

    }


    /* HOBBY */

    if (selectedActivity === "hobby") {

        girl.style.left = "34%";

    }


    document
        .getElementById("timer")
        .style.display = "block";


    paused = false;


    document
        .getElementById("pauseButton")
        .textContent = "Pause";


    updateTimerDisplay();


    timerInterval =
        setInterval(function() {


            if (!paused) {

                remainingSeconds--;


                updateTimerDisplay();


                if (remainingSeconds <= 0) {

                    sessionFinished();

                }

            }


        }, 1000);

}


/* =========================
   TIMER DISPLAY
========================= */

function updateTimerDisplay() {

    let minutes =
        Math.floor(
            remainingSeconds / 60
        );


    let seconds =
        remainingSeconds % 60;


    minutes =
        String(minutes).padStart(2, "0");


    seconds =
        String(seconds).padStart(2, "0");


    document
        .getElementById("timerDisplay")
        .textContent =
        minutes + ":" + seconds;

}


/* =========================
   PAUSE
========================= */

function pauseTimer() {

    paused = !paused;


    const button =
        document.getElementById("pauseButton");


    if (paused) {

        button.textContent = "Resume";

    } else {

        button.textContent = "Pause";

    }

}


/* =========================
   END SESSION
========================= */

function endSession() {

    clearInterval(timerInterval);

    timerInterval = null;


    document
        .getElementById("timer")
        .style.display = "none";


    document
        .getElementById("girl")
        .classList.remove("working");


    document
        .getElementById("girl")
        .style.left = "48%";


    remainingSeconds = 0;

}


/* =========================
   SESSION FINISHED
========================= */

function sessionFinished() {

    clearInterval(timerInterval);

    timerInterval = null;


    document
        .getElementById("timer")
        .style.display = "none";


    document
        .getElementById("girl")
        .classList.remove("working");


    document
        .getElementById("girl")
        .style.left = "48%";


    playChime();


    setTimeout(function() {

        alert(
            "Focus session complete ✦"
        );

    }, 300);


    remainingSeconds = 0;

}


/* =========================
   THREE NOTE CHIME
========================= */

function playChime() {

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


    if (!AudioContext) return;


    const audioContext =
        new AudioContext();


    const notes = [

        523.25,
        659.25,
        783.99

    ];


    notes.forEach(function(freq, index) {


        const oscillator =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        oscillator.type = "sine";


        oscillator.frequency.value =
            freq;


        oscillator.connect(gain);


        gain.connect(
            audioContext.destination
        );


        const startTime =
            audioContext.currentTime +
            index * 0.22;


        gain.gain.setValueAtTime(
            0,
            startTime
        );


        gain.gain.linearRampToValueAtTime(
            0.18,
            startTime + 0.03
        );


        gain.gain.exponentialRampToValueAtTime(
            0.001,
            startTime + 0.6
        );


        oscillator.start(startTime);


        oscillator.stop(
            startTime + 0.6
        );

    });

}


</script>

</body>

</html>
